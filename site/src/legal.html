{{include:head}}
<body class="legalpage">
{{include:header}}
<main id="main" class="section">
  <article class="wrap narrow legal">
    <p><a href="{{home}}">{{legal.back}}</a></p>
    <h1>{{legal_title}}</h1>
    <p class="fine">{{legal.updated}}: {{legal_date}}</p>
    {{legal_body}}
  </article>
</main>
{{include:footer}}
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script id="i18n" type="application/json">{{json:js_bundle}}</script>
<script src="{{base}}assets/app.js?v={{asset_v}}" defer></script>
</body>
</html>
