<!doctype html>
<html lang="{{lang}}" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{a:page_title}}</title>
<meta name="description" content="{{a:page_desc}}">
<meta name="keywords" content="{{a:meta.keywords}}">
<meta name="author" content="AndrexTheDev">
<meta name="theme-color" content="#0A0A0A">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{page_url}}">
{{hreflang}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="AutoVybz">
<meta property="og:title" content="{{a:og_title}}">
<meta property="og:description" content="{{a:og_desc}}">
<meta property="og:url" content="{{page_url}}">
<meta property="og:image" content="{{site_url}}assets/img/og-{{lang}}.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{a:meta.og_title}}">
<meta property="og:locale" content="{{locale}}">
{{og_alternates}}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{a:og_title}}">
<meta name="twitter:description" content="{{a:og_desc}}">
<meta name="twitter:image" content="{{site_url}}assets/img/og-{{lang}}.png">
<link rel="icon" href="{{base}}assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="{{base}}assets/img/logo-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="{{base}}assets/img/apple-touch-icon.png">
<link rel="manifest" href="{{base}}manifest.webmanifest">
<link rel="stylesheet" href="{{base}}assets/style.css?v={{asset_v}}">
{{jsonld}}
</head>
