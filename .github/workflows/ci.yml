# CI: compiles the app (incl. Compose UI + native Oboe engine) and runs the JVM unit tests on every push / PR.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Android NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" >/dev/null

      - name: Unit tests + debug build
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon --console=plain 2>&1 | tee gradle.log; then
            # surface compiler / test errors as annotations (raw logs are not always reachable)
            grep -E '^e: |error:|FAILED|What went wrong|Exception|expected:<' gradle.log | head -60 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Mic profile DB is up to date
        run: |
          python3 tools/micdb/generate_mic_profiles.py
          git diff --exit-code app/src/main/assets/autovybz/mic_profiles.json

      - name: AutoEq pack is up to date
        run: |
          python3 tools/autoeq/pack_autoeq.py
          git diff --exit-code app/src/main/assets/autoeq/autoeq.bin

      - name: Release build smoke test (R8 + shrinkResources)
        run: |
          set -o pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass android -keypass android \
            -alias dryrun -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Dry run" >/dev/null
          export ORG_GRADLE_PROJECT_RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks"
          export ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=android
          export ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=dryrun
          export ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=android
          if ! ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee release.log; then
            grep -n -A60 "What went wrong" release.log | head -80 | sed 's/^/::error::/'
            ls -la app/build/intermediates/merged_java_res/release/ 2>&1 | sed 's/^/::error::/'
            python3 - <<'PYEOF' 2>&1 | sed 's/^/::error::/'
          import zipfile, collections
          p = 'app/build/intermediates/merged_java_res/release/base.jar'
          try:
              z = zipfile.ZipFile(p)
              names = z.namelist()
              print(f"base.jar OK: {len(names)} entries, dupes={[n for n,c in collections.Counter(names).items() if c>1][:10]}")
          except Exception as e:
              import os
              print(f"base.jar UNREADABLE: {e!r} size={os.path.getsize(p) if os.path.exists(p) else 'MISSING'}")
          PYEOF
            exit 1
          fi
          ls -la app/build/outputs/apk/release/
          python3 - <<'PYEOF' >>"$GITHUB_STEP_SUMMARY"
          import glob, zipfile
          a = glob.glob('app/build/outputs/apk/release/*.apk')[0]
          z = zipfile.ZipFile(a)
          infos = z.infolist()
          libs = sorted({i.filename.split('/')[1] for i in infos if i.filename.startswith('lib/')})
          ae = [i for i in infos if 'autoeq' in i.filename]
          print(f"### Release APK `{a}`")
          print(f"- entries: {len(infos)}, size: {sum(i.compress_size for i in infos)/1e6:.2f} MB compressed")
          print(f"- ABIs: {libs}")
          print(f"- autoeq entries: {[i.filename for i in ae]} ({[i.compress_size for i in ae]})")
          PYEOF

      - name: Native host checks (FFT vs. DFT, Oboe/JNI syntax)
        if: always()
        run: |
          bash tools/native/host_check.sh > host.log 2>&1 || { cat host.log; tail -40 host.log | sed 's/^/::error::/'; exit 1; }
          cat host.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autovybz-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            gradle.log
            release.log
            host.log
          if-no-files-found: ignore
