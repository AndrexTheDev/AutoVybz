# CI: compiles the app (incl. Compose UI + native Oboe engine) and runs the JVM unit tests on every push / PR.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Android NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" >/dev/null

      - name: Native host checks (FFT vs. DFT, Oboe/JNI syntax)
        run: tools/native/host_check.sh

      - name: Mic profile DB is up to date
        run: |
          python3 tools/micdb/generate_mic_profiles.py
          git diff --exit-code app/src/main/assets/autovybz/mic_profiles.json

      - name: Unit tests + debug build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autovybz-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
          if-no-files-found: ignore
