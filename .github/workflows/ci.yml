# CI: compiles the app (incl. Compose UI + native Oboe engine) and runs the JVM unit tests on every push / PR.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Android NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" >/dev/null

      - name: Unit tests + debug build
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon --console=plain 2>&1 | tee gradle.log; then
            # surface compiler / test errors as annotations (raw logs are not always reachable)
            grep -E '^e: |error:|FAILED|What went wrong|Exception|expected:<' gradle.log | head -60 | sed 's/^/::error::/'
            exit 1
          fi

      # The Python port of the DSP/Auto-EQ stack is what the offline live probe (tools/probe) judges the
      # app with; if it drifts from the Kotlin golden values, every probe finding becomes meaningless.
      - name: Probe parity (Python port vs. Kotlin golden values)
        run: |
          set -o pipefail
          python3 -m venv /tmp/probe-venv
          /tmp/probe-venv/bin/pip install --quiet numpy
          /tmp/probe-venv/bin/python tools/probe/check_parity.py | tee parity.log

      # The numbers behind docs/AUDIO_ROADMAP.md (THD from the sweep, window vs. reverberation, band
      # saturation, noise robustness). No music file needed, ~4 s - it fails when the port changes in a
      # way that would invalidate the roadmap's reasoning.
      - name: Probe findings (roadmap evidence)
        run: /tmp/probe-venv/bin/python tools/probe/pipeline_findings.py

      # The field log (Studio -> field data) is analysed by tools/fielddata/analyze.py, whose decision
      # rules are built on six of the app's constants. If one of them moves, the analysis has to be
      # revisited deliberately - a threshold that changes silently invalidates every conclusion drawn
      # from an exported file.
      - name: Field-data rules match the app and still fire
        run: |
          python3 tools/fielddata/analyze.py --check
          python3 tools/fielddata/analyze.py --selftest

      - name: Mic profile DB is up to date
        run: |
          python3 tools/micdb/generate_mic_profiles.py
          git diff --exit-code app/src/main/assets/autovybz/mic_profiles.json

      - name: AutoEq pack is up to date
        run: |
          python3 tools/autoeq/pack_autoeq.py
          git diff --exit-code app/src/main/assets/autoeq/autoeq.bin

      - name: Native host checks (FFT vs. DFT, Oboe/JNI syntax)
        if: always()
        run: |
          bash tools/native/host_check.sh > host.log 2>&1 || { cat host.log; tail -40 host.log | sed 's/^/::error::/'; exit 1; }
          cat host.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autovybz-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            gradle.log
            host.log
          if-no-files-found: ignore
